
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.1.0"
description = "Open-source machine learning model monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "scipy>=1.12,<2.0",
    "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "build>=1.2",
]
server = [
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
]
production = [
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "sentence-transformers>=3.0,<6.0",
    "Pillow>=10.0,<13.0",
]
distributed = [
    "redis>=5.0,<7.0",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"
driftwatch-serve = "driftwatch.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.12"
files = ["src/driftwatch"]
warn_unused_configs = true
